<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video List | StreamLock</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:#060913;color:#f1f5f9}
    .collection-shell{width:min(100% - 28px,1040px);margin:20px auto 44px}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:#8fa6c5;text-decoration:none;font-size:.74rem;margin-bottom:13px}.back-link:hover{color:#00f2fe}.back-link .sl-ic{margin:0;transform:rotate(180deg)}
    .collection-hero{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:center;padding:13px;background:linear-gradient(135deg,#0d1424,#101b30);border:1px solid rgba(0,242,254,.18);border-radius:13px;margin-bottom:18px}
    .collection-cover{display:block;width:210px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#02060d}
    .collection-title{font-size:clamp(1.2rem,3vw,1.65rem);line-height:1.15;color:#fff;margin:5px 0 6px}.collection-description{color:#8fa6c5;font-size:.78rem;line-height:1.5;max-width:680px}.collection-hero-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}
    .collection-favorite{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(251,191,36,.3);border-radius:7px;background:rgba(251,191,36,.08);color:#fbbf24;padding:7px 11px;font-size:.7rem;cursor:pointer}.collection-favorite.active{background:rgba(251,191,36,.16)}.collection-favorite .sl-ic{width:14px;height:14px;margin:0}
    .collection-list-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 10px}.collection-list-heading h2{font-size:1rem;color:#f1f6ff}.collection-list-heading span{color:#7188aa;font-size:.68rem}
    .collection-videos{display:grid;gap:8px}.collection-video{display:grid;grid-template-columns:34px 128px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 11px 8px 8px;background:#0d1424;border:1px solid rgba(255,255,255,.085);border-radius:10px;text-decoration:none;transition:border-color .2s,transform .2s}.collection-video:hover{border-color:rgba(0,242,254,.4);transform:translateX(2px)}
    .video-number{color:#526b8e;font-size:.73rem;font-weight:800;text-align:center}.collection-video-thumb{width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:#000}.collection-video-info{min-width:0}.collection-video-title{display:block;color:#edf5ff;font-size:.86rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.collection-video-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#7e94b4;font-size:.69rem;line-height:1.4;margin-top:4px}.collection-watch{display:inline-flex;align-items:center;gap:5px;color:#00f2fe;font-size:.68rem;font-weight:800;white-space:nowrap}.collection-watch .sl-ic{width:14px;height:14px;margin:0}
    .collection-empty{padding:28px 18px;text-align:center;background:#0d1424;border:1px dashed rgba(255,255,255,.14);border-radius:11px;color:#8fa6c5;font-size:.8rem}.collection-empty a{color:#00f2fe}
    @media(max-width:600px){.collection-shell{width:min(100% - 20px,1040px);margin-top:14px}.collection-hero{grid-template-columns:104px minmax(0,1fr);gap:12px;padding:10px}.collection-cover{width:104px}.collection-title{font-size:1rem}.collection-description{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.68rem}.collection-video{grid-template-columns:86px minmax(0,1fr) auto;gap:9px;padding:8px}.video-number{display:none}.collection-video-thumb{width:86px}.collection-video-title{font-size:.76rem}.collection-video-desc{-webkit-line-clamp:1;font-size:.63rem}.collection-watch span:last-child{display:none}}


    /* V10: vertical, compact video discovery within a collection */
    .collection-videos{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
    .collection-video{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;border-radius:10px}
    .collection-video:hover{transform:translateY(-2px)}
    .video-number{display:none}
    .collection-video-thumb{width:100%;height:auto;aspect-ratio:16/10;border-radius:0}
    .collection-video-info{padding:9px 10px 5px;flex:1}
    .collection-video-title{font-size:.79rem;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.4em}
    .collection-video-desc{font-size:.64rem;-webkit-line-clamp:2}
    .collection-watch{padding:5px 10px 10px;font-size:.63rem}
    @media(max-width:600px){.collection-videos{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.collection-video{display:flex;padding:0}.collection-video-thumb{width:100%;height:auto;aspect-ratio:16/10}.collection-video-info{padding:8px}.collection-video-title{font-size:.72rem}.collection-video-desc{display:none}.collection-watch{padding:3px 8px 8px}.collection-watch span:last-child{display:inline}}
  </style>
</head>
<body>
  <main class="collection-shell">
    <a class="back-link" id="back-link" href="browse.html"><span class="sl-ic" data-icon="arrowUpRight"></span> Back to Browse</a>
    <div id="collection-content">
      <section class="collection-hero" id="collection-hero">
        <img class="collection-cover" id="collection-cover" alt="Video list cover">
        <div>
          <div class="sl-list-badges"><span class="sl-list-status" id="collection-status">Ongoing</span><span class="sl-list-count" id="collection-count">0 videos</span></div>
          <h1 class="collection-title" id="collection-title">Video List</h1>
          <p class="collection-description" id="collection-description"></p>
          <div class="collection-hero-actions"><button type="button" class="collection-favorite" id="collection-favorite" onclick="toggleFavorite()"><span class="sl-ic" data-icon="starOutline"></span><span>Favorite</span></button></div>
        </div>
      </section>
      <div class="collection-list-heading"><h2>Videos in This List</h2><span>Select a video to start watching</span></div>
      <div class="collection-videos" id="videos-container"></div>
    </div>
  </main>

  <script src="supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="storage.js"></script>
  <script>
    const groupId = new URLSearchParams(location.search).get('id') || '';
    const returnToFavorites = new URLSearchParams(location.search).get('from') === 'favorites';
    let appData = null;
    let session = null;
    let group = null;
    let videos = [];

    function init() {
      appData = getLocalData();
      session = getCurrentSession();
      group = (appData.groups || []).find(item => item.id === groupId);
      document.getElementById('back-link').href = returnToFavorites ? 'browse.html?favorites=1' : 'browse.html';
      document.getElementById('back-link').lastChild.textContent = returnToFavorites ? ' Back to My Favorite Video Lists' : ' Back to Browse';
      if (!group) {
        document.getElementById('collection-content').innerHTML = '<div class="collection-empty">This video list could not be found. <a href="browse.html">Return to Browse</a>.</div>';
        document.title = 'Video List Not Found | StreamLock';
        return;
      }
      videos = (group.videoIds || []).map(id => (appData.links || []).find(video => video.id === id)).filter(Boolean);
      document.title = slStripEmoji(group.title) + ' | StreamLock';
      document.getElementById('collection-title').textContent = group.title;
      document.getElementById('collection-description').textContent = group.description || 'Curated video collection.';
      document.getElementById('collection-count').textContent = videos.length + (videos.length === 1 ? ' video' : ' videos');
      const complete = group.status === 'complete';
      const status = document.getElementById('collection-status');
      status.textContent = complete ? 'Complete' : 'Ongoing';
      status.classList.toggle('complete',complete);
      const cover = document.getElementById('collection-cover');
      cover.src = group.thumbnail || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80';
      hydrateIndexedImages(document.getElementById('collection-hero'));
      renderFavoriteButton();
      renderVideos();
    }

    function renderFavoriteButton() {
      const favorite = !!(session && (session.favorites || []).includes(group.id));
      const button = document.getElementById('collection-favorite');
      button.classList.toggle('active',favorite);
      button.setAttribute('aria-pressed',String(favorite));
      button.innerHTML = '<span class="sl-ic">' + SLIcon(favorite ? 'star' : 'starOutline') + '</span><span>' + (favorite ? 'Favorited' : 'Favorite') + '</span>';
      slHydrate(button);
    }

    function renderVideos() {
      const container = document.getElementById('videos-container');
      if (!videos.length) {
        container.innerHTML = '<div class="collection-empty">This list does not contain any videos yet.</div>';
        return;
      }
      container.innerHTML = videos.map((video,index) => {
        const thumb = video.thumbnail || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80';
        return '<a class="collection-video" href="watch.html?id=' + encodeURIComponent(video.id) + '"><span class="video-number">' + String(index + 1).padStart(2,'0') + '</span><img class="collection-video-thumb" src="' + escapeHtml(thumb) + '" alt=""><span class="collection-video-info"><span class="collection-video-title">' + escapeHtml(video.title) + '</span><span class="collection-video-desc">' + escapeHtml(video.description || 'Open this video to start watching.') + '</span></span><span class="collection-watch"><span class="sl-ic">' + SLIcon('play') + '</span><span>Watch Video</span></span></a>';
      }).join('');
      slHydrate(container);
      hydrateIndexedImages(container);
    }

    async function toggleFavorite() {
      if (!session) {
        if (await slConfirm('Sign in to save your favorite video lists. Would you like to sign in now?','Save Favorite Video Lists')) location.href = 'login.html';
        return;
      }
      if (!session.favorites) session.favorites = [];
      const index = session.favorites.indexOf(group.id);
      if (index === -1) session.favorites.push(group.id); else session.favorites.splice(index,1);
      setCurrentSession(session);
      const userIndex = appData.users.findIndex(user => user.id === session.id);
      if (userIndex !== -1) { appData.users[userIndex].favorites = session.favorites; saveLocalData(appData); }
      renderFavoriteButton();
    }

    function escapeHtml(value) {
      return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    slBoot(init);
  </script>
</body>
</html>
