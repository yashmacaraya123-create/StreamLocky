<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register - StreamLock</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060913;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-image: radial-gradient(circle at 50% 10%, rgba(0, 242, 254, 0.08) 0%, transparent 60%);
    }
    .login-page { width:min(100%, 980px); display:grid; grid-template-columns:380px minmax(0,1fr); gap:24px; align-items:center; }
    .login-page .sl-ad-section { margin-top:0; }
    @media(max-width:800px){ .login-page{grid-template-columns:1fr} .auth-card{margin:0 auto} }
    .auth-card {
      background: #0d1424;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      padding: 24px 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 4px;
    }
    .brand-logo span { color: #00f2fe; }
    .auth-sub {
      text-align: center;
      color: #94a3b8;
      font-size: 0.8rem;
      margin-bottom: 18px;
    }
    .auth-tabs {
      display: flex;
      background: #141c2e;
      border-radius: 6px;
      padding: 3px;
      margin-bottom: 16px;
    }
    .auth-tab {
      flex: 1;
      padding: 6px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .auth-tab.active {
      background: #00f2fe;
      color: #051322;
    }
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #cbd5e1;
    }
    .form-input {
      width: 100%;
      padding: 8px 12px;
      background: #080d1a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }
    .form-input:focus { border-color: #00f2fe; }
    .btn-submit {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #00f2fe 0%, #007dfe 100%);
      color: #051322;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-submit:hover { opacity: 0.95; }
    .auth-footnote {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <main class="login-page">
  <div class="auth-card">
    <div class="brand-logo">
      <span>⚡</span> StreamLock<span>Pay</span>
    </div>
    <div class="auth-sub" id="auth-sub-text">Sign in to save favorite collections or manage platform</div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="setAuthMode('login')">Sign In</button>
      <button class="auth-tab" id="tab-register" onclick="setAuthMode('register')">Register</button>
    </div>

    <form id="auth-form" onsubmit="handleAuthSubmit(event)">
      <div class="form-group" id="group-name" style="display:none;">
        <label class="form-label">Full Name</label>
        <input type="text" id="inp-name" class="form-input" placeholder="Your full name">
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="text" id="inp-identifier" class="form-input" placeholder="Enter your account email" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="inp-password" class="form-input" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-submit" id="btn-auth-submit">Sign In Now</button>
    </form>

    <div class="auth-footnote">
      Protected StreamLock Member Portal
    </div>
  </div>
  <section class="sl-ad-section">
    <div class="sl-section-heading"><span class="sl-ic" data-icon="spark"></span><span>Sponsor Picks</span></div>
    <p class="sl-section-sub">Featured partner offers selected for this page.</p>
    <div class="sl-ad-trio" data-ad-placement="login"></div>
    <div class="sl-ad-disclosure">Sponsored content · supports free streaming</div>
  </section>
  </main>

  <script src="supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="storage.js"></script>
  <script>
    let mode = 'login';

    function setAuthMode(newMode) {
      mode = newMode;
      document.getElementById('tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-register').classList.toggle('active', mode === 'register');
      document.getElementById('group-name').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('btn-auth-submit').innerText = mode === 'register' ? 'Create Account' : 'Sign In Now';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('inp-identifier').value.trim();
      const password = document.getElementById('inp-password').value;
      const button = document.getElementById('btn-auth-submit');
      if (!email.includes('@')) { await slAlert('Enter the email address used for your Supabase account.'); return; }
      button.disabled = true;
      try {
        if (mode === 'login') {
          const { error } = await window.slSupabase.auth.signInWithPassword({ email,password });
          if (error) throw error;
        } else {
          const name = document.getElementById('inp-name').value.trim() || 'Viewer';
          const username = email.split('@')[0].replace(/[^a-zA-Z0-9_-]/g,'-');
          const { data,error } = await window.slSupabase.auth.signUp({
            email,password,options:{ data:{full_name:name,username},emailRedirectTo:location.origin + location.pathname }
          });
          if (error) throw error;
          if (!data.session) {
            await slAlert('Account created. Check your email to confirm it, then return here to sign in.','Confirm Your Email');
            return;
          }
        }
        const { data } = await window.slSupabase.auth.getSession();
        await slCloudSyncSession(data.session);
        const session = getCurrentSession();
        await slAlert(session && session.role === 'admin' ? 'Developer privileges verified. Entering Admin Management...' : 'Welcome! Your StreamLock account is now active.');
        window.location.href = session && session.role === 'admin' ? 'index.html' : 'profile.html';
      } catch (error) {
        await slAlert(error.message || 'Authentication failed. Please try again.','Sign In Unsuccessful');
      } finally { button.disabled = false; }
    }

    slBoot(() => {});
  </script>
</body>
</html>
